<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12285a">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Zeezap Business Manager</title>
<style>
:root{--navy:#12285a;--navy2:#1d3a7a;--gold:#c8963e;--bg:#f3f5f9;--card:#fff;--tx:#1b2335;--mut:#66708a;--bd:#e2e6ef;--ok:#14804a;--bad:#c62f3a;--warn:#b7791f;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy2)}
#app{min-height:100vh}
.side{display:none}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.top b{font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{opacity:.75}
.top button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:6px 10px}
main{padding:14px 14px 90px;max-width:1180px;margin:0 auto}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bnav a{flex:1;text-align:center;padding:7px 2px 6px;font-size:11px;text-decoration:none;color:var(--mut);cursor:pointer}
.bnav a i{display:block;font-style:normal;font-size:20px;line-height:1.2}
.bnav a.on{color:var(--navy);font-weight:600}
@media(min-width:900px){
 .side{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;width:228px;background:var(--navy);color:#fff;padding:14px 10px;overflow:auto}
 .side h2{margin:6px 8px 14px;font-size:17px}.side h2 small{display:block;font-weight:400;opacity:.7;font-size:12px}
 .side a{display:flex;gap:10px;align-items:center;color:#dfe6f7;text-decoration:none;padding:9px 12px;border-radius:9px;cursor:pointer}
 .side a:hover{background:rgba(255,255,255,.08)}.side a.on{background:var(--gold);color:#241a05;font-weight:600}
 .bnav{display:none}.top{margin-left:228px}main{margin-left:228px;max-width:none;padding:18px 26px 40px}
}
h1{font-size:20px;margin:2px 0 12px}h2.sec{font-size:15px;margin:18px 0 8px;color:var(--navy)}
.pgh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.pgh h1{margin:0;flex:1;min-width:140px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:11px 13px}
.tile small{color:var(--mut);display:block;font-size:12px}.tile b{font-size:19px;display:block;margin-top:2px}
.tile.navy{background:var(--navy);color:#fff;border-color:var(--navy)}.tile.navy small{color:#b9c6e6}
.tile.gold{border-left:4px solid var(--gold)}
.pos{color:var(--ok)}.neg{color:var(--bad)}.mut{color:var(--mut)}.warn{color:var(--warn)}
.btn{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--tx)}
.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.g{background:var(--gold);border-color:var(--gold);color:#241a05}
.btn.d{color:var(--bad);border-color:#f0c9cd}.btn.sm{padding:5px 9px;font-size:13px}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.chips{display:flex;gap:6px;overflow:auto;padding-bottom:4px;margin-bottom:8px}
.chip{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:5px 12px;white-space:nowrap;cursor:pointer;font-size:13px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;background:#e8ecf6;color:var(--navy)}
.badge.ok{background:#dff3e8;color:var(--ok)}.badge.bad{background:#fbe1e3;color:var(--bad)}.badge.warn{background:#fdf0d8;color:var(--warn)}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.list .it:last-child{border:0}.list .it .m{flex:1;min-width:0}.list .it .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .it .m small{color:var(--mut)}.list .it .r{text-align:right;white-space:nowrap}
input,select,textarea{width:100%;border:1px solid #cdd4e3;border-radius:9px;padding:9px 10px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #9db4ee;border-color:var(--navy2)}
label.f{display:block;margin-bottom:9px;font-size:12.5px;color:var(--mut)}label.f>input,label.f>select,label.f>textarea{margin-top:3px;color:var(--tx);font-size:15px}
.fg{display:grid;gap:0 10px;grid-template-columns:1fr 1fr}.fg .w{grid-column:1/-1}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th{text-align:left;color:var(--mut);font-weight:600;border-bottom:2px solid var(--bd);padding:6px 6px;white-space:nowrap}
.tbl td{border-bottom:1px solid var(--bd);padding:7px 6px;vertical-align:top}.tbl .n{text-align:right;white-space:nowrap}.tbl tfoot td{font-weight:700;border-top:2px solid var(--bd)}
.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover{background:#f6f8fd}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mb{position:fixed;inset:0;background:rgba(10,20,45,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.md{background:#fff;width:100%;max-height:96vh;display:flex;flex-direction:column;border-radius:16px 16px 0 0}
.mh{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--bd)}
.mh .x{border:0;background:#eef1f7;border-radius:50%;width:30px;height:30px;cursor:pointer}
.mbd{padding:14px 16px;overflow:auto;flex:1}.mf{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media(min-width:700px){.mb{align-items:center}.md{max-width:620px;border-radius:16px}.md.wide{max-width:860px}}
.itm{border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:8px;background:#fafbfe}
.itm .l1{display:flex;gap:6px;align-items:center}.itm .l2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.itm .l2 label{font-size:11px;color:var(--mut)}.itm .l2 input{padding:6px 7px}
.tot{margin-left:auto;max-width:330px}.tot div{display:flex;justify-content:space-between;padding:3px 0}.tot .g{font-size:18px;font-weight:700;border-top:2px solid var(--bd);margin-top:4px;padding-top:6px}
.warnbox{background:#fff6e0;border:1px solid #f0d594;color:#7a5410;border-radius:9px;padding:8px 10px;margin:8px 0;font-size:13.5px}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:6px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars i{display:block;width:100%;background:var(--navy2);border-radius:4px 4px 0 0;min-height:2px}.bars span{font-size:10px;color:var(--mut);margin-top:3px}
.hbar{height:8px;background:#e8ecf6;border-radius:4px;overflow:hidden}.hbar i{display:block;height:100%;background:var(--gold)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:99;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#1b2335;color:#fff;padding:9px 15px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.login{max-width:380px;margin:0 auto;padding:9vh 18px}.login .logo{width:62px;height:62px;border-radius:16px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-size:30px;font-weight:800;margin-bottom:10px}
.login h1{font-size:24px;margin:0}.login p{color:var(--mut);margin:2px 0 18px}
.sync{font-size:12px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.16)}
pre.code{background:#101a33;color:#d5e1ff;border-radius:10px;padding:10px;overflow:auto;font-size:12px;max-height:240px}
@media print{.top,.bnav,.side,#toast{display:none!important}main{margin:0;padding:0}}
</style>
</head>

const r2=v=>Math.round((v+Number.EPSILON)*100)/100;
const inr=v=>{v=r2(N(v));return (v<0?'-':'')+'₹'+Math.abs(v).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2})};

const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return fmtISO(d)};
const dayDiff=(a,b)=>Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000);
const fdate=s=>{if(!s)return'';const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2)};
const monthStart=(s)=>(s||today()).slice(0,7)+'-01';
const byDate=(a,b)=>(a.date||'').localeCompare(b.date||'')||(a._c||0)-(b._c||0);
const sum=(a,f)=>a.reduce((x,y)=>x+N(f?f(y):y),0);
const uniq=a=>[...new Set(a)];
function periodRange(p){const t=today(),d=new Date();
 if(p==='today')return[t,t];
 if(p==='yesterday'){const y=addDays(t,-1);return[y,y]}
 if(p==='week'){const dow=(d.getDay()+6)%7;return[addDays(t,-dow),t]}
 if(p==='month')return[monthStart(),t];
 if(p==='lastmonth'){const f=new Date(d.getFullYear(),d.getMonth()-1,1),l=new Date(d.getFullYear(),d.getMonth(),0);return[fmtISO(f),fmtISO(l)]}
 if(p==='fy'){const y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;return[y+'-04-01',t]}
 return['2000-01-01','2999-12-31']}

function loadDB(){try{const s=localStorage.getItem(LS_KEY);if(s){const o=JSON.parse(s);COLS.forEach(c=>DB[c]=o[c]||{});DB.meta=o.meta||{}}}catch(e){console.warn('load',e)}ver++}
let _pt=null;

function flushDB(){try{localStorage.setItem(LS_KEY,JSON.stringify(DB))}catch(e){toast('⚠️ Storage full/blocked — backup export karo')}}
window.addEventListener('beforeunload',flushDB);
function all(c){const k=cacheM[c];if(k&&k.v===ver)return k.a;const a=Object.values(DB[c]).filter(r=>!r._d);cacheM[c]={v:ver,a};return a}
const get=(c,id)=>{const r=DB[c][id];return r&&!r._d?r:null};
function put(c,rec){if(!rec.id)rec.id=uid();if(!rec._c)rec._c=Date.now();rec._u=Date.now();DB[c][rec.id]=rec;ver++;persist();scheduleSync();return rec}
function del(c,id){DB[c][id]={id,_d:1,_u:Date.now()};ver++;persist();scheduleSync()}
function memo(key,fn){const k=cacheM[key];if(k&&k.v===ver)return k.a;const a=fn();cacheM[key]={v:ver,a};return a}
const S=()=>Object.assign({},DEF_SETTINGS,get('settings','main')||{});

function nextNo(col,prefix){const re=new RegExp('^'+prefix.replace(/[^\w]/g,'\\$&')+'(\\d+)$');let m=0;Object.values(DB[col]).forEach(r=>{const x=re.exec(r.no||'');if(x)m=Math.max(m,+x[1])});return prefix+String(m+1).padStart(4,'0')}
const myCode=()=>(me&&me.code)||'A';

/* ---------- auth ---------- */
async function hashPw(pw,salt){
 try{if(window.crypto&&crypto.subtle){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:60000,hash:'SHA-256'},k,256);
  return 'p1:'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
 let h=5381;const s=salt+'|'+pw;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return 'd1:'+h.toString(16)+s.length}
async function makeUser(p){const salt=uid()+uid();return Object.assign({},p,{salt,hash:await hashPw(p.pw,salt),active:true,pw:undefined})}
async function tryLogin(username,pw){
 const u=all('users').find(x=>x.username.toLowerCase()===String(username).trim().toLowerCase()&&x.active!==false);
 if(!u)return null; const h=await hashPw(pw,u.salt); return h===u.hash?u:null}
function setSession(u,remember){try{(remember?localStorage:sessionStorage).setItem(SESS_KEY,u.id)}catch(e){}}
function getSession(){try{return sessionStorage.getItem(SESS_KEY)||localStorage.getItem(SESS_KEY)}catch(e){return null}}
function clearSession(){try{sessionStorage.removeItem(SESS_KEY);localStorage.removeItem(SESS_KEY)}catch(e){}}

/* ---------- Google Sheets (Apps Script) record-level sync ---------- */
let _syncT=null,_syncing=false,syncState='off';
function scheduleSync(){if(!S().syncUrl||!me)return;clearTimeout(_syncT);_syncT=setTimeout(()=>syncNow(false),1500)}
async function syncNow(manual){
 const cfg=S();if(!cfg.syncUrl){if(manual)toast('Settings me Sync URL daalo');return}
 if(_syncing)return;_syncing=true;setSyncBadge('syncing');
 try{
  const start=Date.now(),lastPush=DB.meta.lastPush||0;let cursor=DB.meta.cursor||0,changed=false,pushed=0;
  const out=[];COLS.forEach(c=>Object.values(DB[c]).forEach(r=>{if((r._u||0)>lastPush)out.push({col:c,id:r.id,u:r._u,d:r._d?1:0,j:JSON.stringify(r)})}));
  const chunks=[];for(let i=0;i<out.length;i+=250)chunks.push(out.slice(i,i+250));if(!chunks.length)chunks.push([]);
  for(const ch of chunks){
   const res=await fetch(cfg.syncUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:cfg.syncKey,cursor,records:ch})});
   const j=await res.json();if(!j.ok)throw new Error(j.error||'sync failed');pushed+=ch.length;
   (j.records||[]).forEach(x=>{const r=JSON.parse(x.j);const cur=DB[x.col]&&DB[x.col][r.id];if(DB[x.col]&&(!cur||(cur._u||0)<(r._u||0))){DB[x.col][r.id]=r;changed=true}});
   cursor=j.now||cursor}
  DB.meta.lastPush=start;DB.meta.cursor=cursor;DB.meta.lastSyncAt=Date.now();
  if(changed){fixDupNos();ver++;if(me&&!get('users',me.id)){logout();return}if(typeof render==='function')render()}
  persist();setSyncBadge('ok');if(manual)toast('✅ Sync ho gaya ('+pushed+' pushed'+(changed?', updates mile':'')+')');
 }catch(e){console.warn(e);setSyncBadge('err');if(manual)toast('Sync error: '+e.message)}
 finally{_syncing=false}}
function setSyncBadge(s){syncState=s;const el=$('#syncb');if(el)el.textContent=({off:'',syncing:'⟳ sync…',ok:'☁ synced',err:'☁ offline'})[s]||'';if(el&&(s==='err'||s==='ok')){const n=pendingCount();if(n)el.textContent+=' ('+n+' pending)'}}
setInterval(()=>{if(me&&S().syncUrl&&navigator.onLine!==false&&!document.hidden)syncNow(false)},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me&&S().syncUrl)syncNow(false)});
window.addEventListener('focus',()=>{if(me&&S().syncUrl)syncNow(false)});
/* two owners may create the same number offline -> later one gets renumbered after sync */
function fixDupNos(){let n=0;[['sales',()=>S().prefix+'-'],['orders',()=>'ORD-'],['purchases',()=>'PUR-'],['returns',null]].forEach(([c,pf])=>{
 if(!pf)return;const g={};Object.values(DB[c]).forEach(r=>{if(r._d||!r.no)return;(g[r.no]=g[r.no]||[]).push(r)});
 Object.values(g).filter(a=>a.length>1).forEach(a=>{a.sort((x,y)=>(x._c||0)-(y._c||0));a.slice(1).forEach(r=>{r.no=nextNo(c,pf());put(c,r);n++})})});
 if(n)setTimeout(()=>toast('Duplicate bill number fix hue: '+n),300)}
function pendingCount(){const lp=DB.meta.lastPush||0;let n=0;COLS.forEach(c=>Object.values(DB[c]).forEach(r=>{if((r._u||0)>lp)n++}));return n}
function shareLink(){const s=S();const cfg=btoa(unescape(encodeURIComponent(JSON.stringify({u:s.syncUrl,k:s.syncKey}))));return location.href.split('#')[0].split('?')[0]+'?cfg='+encodeURIComponent(cfg)}
window.addEventListener('online',()=>{if(me)syncNow(false)});

/* ---------- file helpers ---------- */
function downloadFile(name,data,mime){
 const blob=data instanceof Blob?data:new Blob([data],{type:mime||'text/plain'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function toCSV(rows){return rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n')}
function parseCSV(t){const rows=[];let r=[],f='',q=false;t=t.replace(/^﻿/,'');
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==','||c=='\t'){r.push(f);f=''}
  else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.some(x=>x!==''))rows.push(r);r=[]}
  else f+=c}
 r.push(f);if(r.some(x=>x!==''))rows.push(r);return rows}

function lineCalc(l,gstOn){const base=N(l.qty)*N(l.rate),disc=base*N(l.disc)/100,net=base-disc,tax=gstOn?net*N(l.gst)/100:0;return{base,disc,net,tax,total:net+tax}}
function docCalc(items,flat,gstOn){let net=0,tax=0;items.forEach(l=>{const c=lineCalc(l,gstOn);net+=c.net;tax+=c.tax});
 const g=net+tax-N(flat),total=Math.round(g);return{net:r2(net),tax:r2(tax),flat:r2(N(flat)),round:r2(total-g),total}}
const activeSales=()=>all('sales').filter(d=>d.status!=='cancelled');
const activePurch=()=>all('purchases').filter(d=>d.status!=='cancelled');

/* ---- FIFO stock replay: purchases/openings/returns/adjustments/sales in date order ---- */
function stockCalc(){return memo('_stock',()=>{
 const prods=all('products'),pm={};prods.forEach(p=>pm[p.id]=p);
 const sm={};all('sales').forEach(s=>sm[s.id]=s);
 const ev=[];
 prods.forEach(p=>{if(N(p.openQty)>0)ev.push({d:'0000-00-00',pr:0,c:0,k:'open',pid:p.id,qty:N(p.openQty),cost:N(p.openCost)||N(p.cost)})});
 activePurch().forEach(d=>d.items.forEach(l=>ev.push({d:d.date,pr:1,c:d._c||0,k:'pur',pid:l.pid,qty:N(l.qty),cost:N(l.rate)*(1-N(l.disc)/100)})));
 all('adjustments').forEach(a=>ev.push({d:a.date,pr:N(a.qty)>=0?2:6,c:a._c||0,k:'adj',pid:a.pid,qty:N(a.qty),cost:N(a.cost)||N((pm[a.pid]||{}).cost)}));
 all('returns').forEach(r=>r.items.forEach(l=>ev.push({d:r.date,pr:r.type==='sale'?3:5,c:r._c||0,k:r.type==='sale'?'sret':'pret',rid:r.id,refId:r.refId,pid:l.pid,qty:N(l.qty)})));
 activeSales().forEach(d=>d.items.forEach((l,i)=>ev.push({d:d.date,pr:4,c:d._c||0,k:'sale',sid:d.id,i,pid:l.pid,qty:N(l.qty)})));
 ev.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.pr-b.pr||a.c-b.c);
 const layers={},debt={},lastCost={};
 const res={qty:{},value:{},saleCogs:{},lineCogs:{},retCogs:{}};
 const L=pid=>layers[pid]||(layers[pid]=[]);
 const take=(pid,q)=>{let cost=0,need=q;const ls=L(pid);
  while(need>1e-9&&ls.length){const l=ls[0],t=Math.min(l.q,need);cost+=t*l.c;l.q-=t;need-=t;if(l.q<=1e-9)ls.shift()}
  if(need>1e-9){const fc=lastCost[pid]!==undefined?lastCost[pid]:N((pm[pid]||{}).cost);cost+=need*fc;debt[pid]=(debt[pid]||0)+need}
  return cost};
 const give=(pid,q,c,setLast)=>{if(setLast!==false)lastCost[pid]=c;const d=debt[pid]||0;if(d>0){const t=Math.min(d,q);debt[pid]=d-t;q-=t}if(q>1e-9)L(pid).push({q,c})};
 ev.forEach(e=>{
  if(e.k==='open'||e.k==='pur'||(e.k==='adj'&&e.qty>=0))give(e.pid,Math.abs(e.qty),e.cost);
  else if(e.k==='adj')take(e.pid,-e.qty);
  else if(e.k==='pret')take(e.pid,e.qty);
  else if(e.k==='sale'){const c=take(e.pid,e.qty);res.lineCogs[e.sid+'|'+e.i]=c;res.saleCogs[e.sid]=(res.saleCogs[e.sid]||0)+c}
  else if(e.k==='sret'){let unit;const d=sm[e.refId];
   if(d){let q=0,c=0;d.items.forEach((l,i)=>{if(l.pid===e.pid){q+=N(l.qty);c+=res.lineCogs[d.id+'|'+i]||0}});if(q>0)unit=c/q}
   if(unit===undefined)unit=lastCost[e.pid]!==undefined?lastCost[e.pid]:N((pm[e.pid]||{}).cost);
   give(e.pid,e.qty,unit,false);res.retCogs[e.rid]=(res.retCogs[e.rid]||0)+e.qty*unit}
 });
 prods.forEach(p=>{const ls=layers[p.id]||[];res.qty[p.id]=r2(sum(ls,l=>l.q)-(debt[p.id]||0));res.value[p.id]=r2(sum(ls,l=>l.q*l.c))});
 return res})}
const stockQty=pid=>stockCalc().qty[pid]||0;

/* ---- party (customer 'c' / supplier 's') invoice-wise balances ---- */
function partyCalc(kind,id){return memo('_party'+kind+id,()=>{
 const isC=kind==='c',party=get(isC?'customers':'suppliers',id)||{};
 const docs=(isC?activeSales():activePurch()).filter(d=>d.partyId===id).sort(byDate);
 const rets=all('returns').filter(r=>r.type===(isC?'sale':'purchase')&&r.partyId===id);
 const pays=all('payments').filter(p=>p.partyId===id&&p.partyType===kind);
 const normal=isC?'in':'out',alloc={};let pool=0;const ids=new Set(docs.map(d=>d.id));
 pays.forEach(p=>{if(p.type===normal){let used=0;(p.alloc||[]).forEach(a=>{if(ids.has(a.id)){alloc[a.id]=(alloc[a.id]||0)+N(a.amt);used+=N(a.amt)}});pool+=N(p.amount)-used}else pool-=N(p.amount)});
 const retBy={};
 rets.forEach(r=>{if(r.refId&&ids.has(r.refId))retBy[r.refId]=(retBy[r.refId]||0)+N(r.total);else pool+=N(r.total)});
 const t=today(),cd=N(party.creditDays);
 const rows=docs.map(d=>{let due=N(d.total)-(alloc[d.id]||0)-(retBy[d.id]||0);if(due<0){pool+=-due;due=0}
  const age=dayDiff(t,d.date);return{doc:d,total:d.total,paid:r2(alloc[d.id]||0),ret:r2(retBy[d.id]||0),due:r2(due),age,overdue:Math.max(0,age-cd)}});
 let openDue=N(party.opening);if(openDue<0){pool+=-openDue;openDue=0}
 if(pool>0){const x=Math.min(pool,openDue);openDue-=x;pool-=x;for(const r of rows){if(pool<=0)break;const y=Math.min(pool,r.due);r.due=r2(r.due-y);pool-=y}}
 let extra=0;if(pool<0){extra=-pool;pool=0}
 const due=r2(openDue+extra+sum(rows,r=>r.due)),advance=r2(pool);
 const open=rows.filter(r=>r.due>0.005);
 const ag={b0:0,b1:0,b2:0,b3:0};open.forEach(r=>{const k=r.age<=15?'b0':r.age<=30?'b1':r.age<=60?'b2':'b3';ag[k]+=r.due});ag.b3+=openDue+extra;
 const overdueAmt=sum(open.filter(r=>r.overdue>0),r=>r.due);
 return{party,rows,open,openDue:r2(openDue),extra:r2(extra),due,advance,balance:r2(due-advance),ag,overdueAmt:r2(overdueAmt),
  oldest:open.length?Math.max(...open.map(r=>r.age)):0}})}
function ledgerEntries(kind,id){
 const isC=kind==='c',party=get(isC?'customers':'suppliers',id)||{},e=[];
 const op=N(party.opening);if(op)e.push({date:'',desc:'Opening balance',inc:op>0?op:0,dec:op<0?-op:0});
 (isC?activeSales():activePurch()).filter(d=>d.partyId===id).forEach(d=>e.push({date:d.date,c:d._c,desc:(isC?'Invoice ':'Bill ')+d.no,inc:N(d.total),dec:0}));
 all('returns').filter(r=>r.type===(isC?'sale':'purchase')&&r.partyId===id).forEach(r=>e.push({date:r.date,c:r._c,desc:'Return '+r.no,inc:0,dec:N(r.total)}));
 all('payments').filter(p=>p.partyId===id&&p.partyType===kind).forEach(p=>{const normal=p.type===(isC?'in':'out');
  e.push({date:p.date,c:p._c,desc:(normal?(isC?'Received':'Paid'):(isC?'Refund given':'Refund received'))+' ('+p.mode+')'+(p.ref?' '+p.ref:''),inc:normal?0:N(p.amount),dec:normal?N(p.amount):0})});
 e.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.c||0)-(b.c||0));
 let bal=0;e.forEach(x=>{bal+=x.inc-x.dec;x.bal=r2(bal)});return e}
function lastRate(cid,pid){const ds=activeSales().filter(d=>d.partyId===cid).sort(byDate).reverse();
 for(const d of ds){const l=d.items.find(x=>x.pid===pid);if(l)return N(l.rate)}return null}

/* ---- profit & loss for a period ---- */
function plCalc(r){const sc=stockCalc();
 const sales=activeSales().filter(d=>inR(d.date,r)),rets=all('returns').filter(x=>x.type==='sale'&&inR(x.date,r));
 const gross=sum(sales,d=>d.net),flat=sum(sales,d=>d.flat),retNet=sum(rets,d=>d.net);
 const cogs=sum(sales,d=>sc.saleCogs[d.id]||0),retCogs=sum(rets,d=>sc.retCogs[d.id]||0);
 const netSales=gross-flat-retNet,cogsNet=cogs-retCogs,gp=netSales-cogsNet;
 const exps=all('expenses').filter(e=>inR(e.date,r)),expTotal=sum(exps,e=>e.amount);
 return{sales,rets,exps,gross:r2(gross),flat:r2(flat),retNet:r2(retNet),netSales:r2(netSales),cogs:r2(cogs),retCogs:r2(retCogs),cogsNet:r2(cogsNet),
  gp:r2(gp),margin:netSales?gp/netSales*100:0,expTotal:r2(expTotal),net:r2(gp-expTotal),tax:r2(sum(sales,d=>d.tax))}}
function expByCat(exps){const m={};exps.forEach(e=>m[e.category||'Other']=(m[e.category||'Other']||0)+N(e.amount));return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function collectedIn(r){return sum(all('payments').filter(p=>p.type==='in'&&p.partyType==='c'&&inR(p.date,r)),p=>p.amount)}
function paidModes(r){const m={};all('payments').filter(p=>inR(p.date,r)).forEach(p=>{const k=p.mode||'Cash';m[k]=m[k]||{in:0,out:0};m[k][p.type]+=N(p.amount)});
 all('expenses').filter(e=>inR(e.date,r)&&e.paidBy==='business').forEach(e=>{const k=e.mode||'Cash';m[k]=m[k]||{in:0,out:0};m[k].out+=N(e.amount)});return m}

/* generic table PDF: used for statements and reports */
function tablePdf({title,sub,cols,rows,foot,name}){
 const p=new Pdf();let y=pdfHeader(p,title,sub||[]);const tot=sum(cols,c=>c.w),W=515;let x=40;cols.forEach(c=>{c.px=x;c.pw=c.w/tot*W;x+=c.pw});
 const head=()=>{p.rect(40,y-11,W,18,NAVY);cols.forEach(c=>p.text(c.a==='r'?c.px+c.pw-3:c.px+3,y+1,c.h,{size:8.5,bold:true,color:[255,255,255],align:c.a}));y+=18};
 head();
 const draw=(r,bold)=>{if(y>800){p.newPage();y=50;head()}
  cols.forEach((c,i)=>{const v=String(r[i]??'');p.text(c.a==='r'?c.px+c.pw-3:c.px+3,y+1,c.a==='r'?v:p.fit(v,8.5,bold,c.pw-6),{size:8.5,bold,align:c.a})});
  p.line(40,y+5,555,y+5,0.35);y+=15};
 rows.forEach(r=>draw(r,false));if(foot){y+=2;p.line(40,y-8,555,y-8,1,NAVY);draw(foot,true)}
 p.text(555,832,'Generated '+fdate(today()),{size:7.5,color:[160,168,185],align:'r'});
 return{bytes:p.out(),name:name||'report.pdf'}}

async function sharePdf(res,text){
 const{bytes,name}=res,blob=new Blob([bytes],{type:'application/pdf'});
 if(window.Android&&typeof Android.sharePdf==='function'){try{let b='';for(let i=0;i<bytes.length;i+=8192)b+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));Android.sharePdf(btoa(b),name);return}catch(e){console.warn(e)}}
 try{const f=new File([blob],name,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name,text:text||''});return}}catch(e){if(e&&e.name==='AbortError')return}
 downloadFile(name,blob)}

function userForm(id){const u=id?get('users',id):{role:'sales',active:true};

  ${fld(id?'New password (blank = no change)':'Password','pw','','password','autocomplete="new-password"')}${sel('Status','active',[['1','Active'],['0','Disabled']],u.active===false?'0':'1')}</div>`,async v=>{

  if(id===me.id&&(v.active==='0'||v.role!=='owner')&&all('users').filter(x=>x.role==='owner'&&x.active!==false).length<2){toast('Aakhri owner ko disable/demote nahi kar sakte');return false}
  let rec=Object.assign({},u,{name:v.name.trim(),username:v.username.trim(),role:v.role,code:(v.code||v.name[0]).toUpperCase().slice(0,2),active:v.active==='1'});
  if(v.pw){const h=await makeUser({pw:v.pw});rec.salt=h.salt;rec.hash=h.hash}if(!id){rec.id=uid()}put('users',rec);if(id===me.id)me=get('users',id);toast('Saved ✓');render()})}

async function restoreBackup(file){if(!file)return;try{const o=JSON.parse(await file.text());if(!o.customers&&!o.users)throw new Error('Invalid file');
 if(!(await askConfirm('Current data replace ho jayega backup se. Pehle backup le liya hai?','Restore')))return;
 COLS.forEach(c=>DB[c]=o[c]||{});DB.meta=o.meta||{};ver++;flushDB();if(!me||!get('users',me.id)){logout()}else{me=get('users',me.id);render()}toast('Restore ho gaya ✓')}catch(e){toast('Restore error: '+e.message)}}

/* ---------------- CSV import ---------------- */
const IMPORT_MAP={customers:{name:['name','shop','shopname','customer','customername','party'],contact:['contact','contactperson','owner'],phone:['phone','mobile','mobileno','contactno'],area:['area','zone','location','city'],address:['address'],gstin:['gstin','gst'],creditLimit:['creditlimit','limit'],creditDays:['creditdays','days'],opening:['opening','openingbalance','balance','outstanding','due']},
 suppliers:{name:['name','supplier','suppliername','party'],phone:['phone','mobile'],address:['address'],opening:['opening','openingbalance','balance','payable']},
 products:{name:['name','product','productname','item'],brand:['brand'],unit:['unit','uom'],mrp:['mrp'],salePrice:['saleprice','sellingprice','rate','price','wholesale'],cost:['cost','purchaseprice','purchaserate','costprice'],gst:['gst','gstpercent','tax'],minStock:['minstock','reorder','minqty'],openQty:['openqty','openingqty','stock','qty','quantity'],openCost:['opencost','openingcost']}};
A.importCsv=()=>{const m=formModal('Import from CSV',`${sel('What to import','type',[['customers','Customers'],['products','Products'],['suppliers','Suppliers']],'customers')}<label class="f">CSV file<input type="file" name="file" accept=".csv,.txt"></label><label class="f">Ya yahan paste karo (pehli row = headers)<textarea name="txt" rows="5"></textarea></label>
  <div class="row"><button class="btn sm" type="button" data-act="csvTemplate">⬇ Template download</button></div><p class="mut" style="font-size:12.5px">Excel se "Save as CSV" karo. Headers: customers → name, phone, area, address, creditLimit, creditDays, opening · products → name, brand, unit, mrp, salePrice, cost, gst, minStock, openQty, openCost</p>`,async(v,m)=>{
  let text=v.txt;const f=m.querySelector('[name=file]').files[0];if(f)text=await f.text();if(!text||!text.trim()){toast('File ya text do');return false}
  const rows=parseCSV(text);if(rows.length<2){toast('Data nahi mila');return false}
  const map=IMPORT_MAP[v.type],hdr=rows[0].map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,'')),idx={};
  Object.entries(map).forEach(([k,al])=>{const i=hdr.findIndex(h=>al.includes(h));if(i>=0)idx[k]=i});
  if(idx.name===undefined){toast('"name" column nahi mila');return false}
  const col=v.type,existing=new Set(all(col).map(x=>x.name.trim().toLowerCase()));let n=0,skip=0;
  rows.slice(1).forEach(r=>{const o={};Object.entries(idx).forEach(([k,i])=>{o[k]=(r[i]||'').trim()});if(!o.name){return}
   if(existing.has(o.name.toLowerCase())){skip++;return}
   ['creditLimit','creditDays','opening','mrp','salePrice','cost','gst','minStock','openQty','openCost'].forEach(k=>{if(k in o)o[k]=N(String(o[k]).replace(/[₹,]/g,''))});
   if(col==='products'&&!('openCost' in o))o.openCost=o.cost||0;if(col==='products'&&!o.unit)o.unit='pcs';
   put(col,o);existing.add(o.name.toLowerCase());n++});
  toast(`${n} import hue${skip?`, ${skip} duplicate skip`:''} ✓`);render()},{label:'Import'})};
A.csvTemplate=(d,t)=>{const type=fv(t.closest('.mb')).type;const hd={customers:['name','phone','area','address','creditLimit','creditDays','opening'],products:['name','brand','unit','mrp','salePrice','cost','gst','minStock','openQty','openCost'],suppliers:['name','phone','address','opening']}[type];downloadFile(type+'-template.csv',toCSV([hd]),'text/csv')};

/* ---------------- import a prepared data file (old ledger -> app) ---------------- */
async function importDataFile(file){
 if(!file)return;
 try{
  const o=JSON.parse(await file.text());if(o.format!=='zeezap-import-v1')throw new Error('Ye Zeezap import file nahi hai');
  const cols=['products','customers','suppliers','sales','purchases','payments'],cnt=cols.map(c=>(o[c]||[]).filter(r=>!get(c,r.id)).length);
  const msg=`Import hoga: ${cnt[0]} products, ${cnt[1]} customers, ${cnt[2]} suppliers, ${cnt[3]} sales invoices, ${cnt[4]} purchase bills, ${cnt[5]} payments. Jo pehle se hai woh dobara nahi judega. Aage badhein?`;
  if(!(await askConfirm(msg,'Import')))return;
  const names=uniq(['sales','purchases','payments'].flatMap(c=>(o[c]||[]).map(r=>r.byName).filter(Boolean))),umap={};
  names.forEach(n=>{let u=all('users').find(x=>x.name.toLowerCase().startsWith(n.toLowerCase())||x.username.toLowerCase()===n.toLowerCase());
   if(!u){u={id:uid(),name:n,username:n.toLowerCase(),role:'owner',active:false,salt:'',hash:'',code:n[0].toUpperCase()};put('users',u)}umap[n]=u.id});
  let n=0;cols.forEach(c=>(o[c]||[]).forEach(r=>{if(get(c,r.id))return;const rec=Object.assign({},r);if(rec.byName){rec.by=umap[rec.byName];delete rec.byName}put(c,rec);n++}));
  if(o.settingsPatch){const s=S(),p={};if(s.partnerA==='Partner 1'&&o.settingsPatch.partnerA)p.partnerA=o.settingsPatch.partnerA;if(s.partnerB==='Partner 2'&&o.settingsPatch.partnerB)p.partnerB=o.settingsPatch.partnerB;if(Object.keys(p).length)saveSettings(p)}
  flushDB();toast(`✅ ${n} records import ho gaye`);render();
 }catch(e){console.error(e);toast('Import error: '+e.message)}}

 sale(14,0,[[0,40,95],[1,30,45]],2000);sale(12,1,[[0,24,95]],1000);sale(10,2,[[0,60,93],[2,30,90]],4000);sale(7,3,[[1,48,45]],0);sale(5,0,[[0,36,95],[2,12,90]],3000);sale(3,4,[[3,24,100]],1000);sale(1,2,[[0,50,95]],0);
 put('orders',{no:nextNo('orders','ORD-'),date:T,partyId:cust[1].id,items:[{pid:P[0].id,name:P[0].name,qty:30,rate:95,disc:0,gst:12},{pid:P[1].id,name:P[1].name,qty:24,rate:45,disc:0,gst:12}],status:'pending',by:me.id,...docCalc([{qty:30,rate:95},{qty:24,rate:45}],0,false)});
 put('expenses',{date:d(9),category:'Transport / Delivery',amount:900,mode:'Cash',paidBy:'A',notes:'Tempo to Thane',by:me.id});put('expenses',{date:d(4),category:'Fuel',amount:600,mode:'Cash',paidBy:'business',by:me.id});

(function boot(){

 try{const q=new URLSearchParams(location.search).get('cfg');if(q){const o=JSON.parse(decodeURIComponent(escape(atob(q))));
  if(o.u&&(!S().syncUrl||S().syncUrl!==o.u)){saveSettings({syncUrl:o.u,syncKey:o.k||''});DB.settings.main._u=0;DB.meta.cursor=0;DB.meta.lastPush=Date.now();persist()}

 const sid=getSession();if(sid){const u=get('users',sid);if(u&&u.active!==false)me=u}

 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})
})();
