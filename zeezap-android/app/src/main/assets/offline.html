<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline</title>
<style>
  body { margin:0; font-family: sans-serif; background:#12285a; color:#fff;
         display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; }
  .box { padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { opacity:.8; margin: 0 0 20px; }
  button { background:#fff; color:#12285a; border:0; border-radius:8px; padding:12px 24px; font-size:16px; }
</style>
</head>
<body>
  <div class="box">
    <h1>No internet connection</h1>
    <p>Connect to the internet and try again.</p>
    <button onclick="location.href='https://aztersting.netlify.app'">Retry</button>
  </div>
</body>
</html>
